name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest   # WPF / net10.0-windows requires a Windows runner
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Joufflu.sln

      # Builds the whole solution, gallery included, so a broken sample fails here too.
      - name: Build
        run: dotnet build Joufflu.sln -c Release --no-restore

      - name: Test
        run: dotnet test Joufflu.sln -c Release --no-build --logger "console;verbosity=normal"
